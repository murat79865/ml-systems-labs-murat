seed: 42
run_name: sgd-cosine
epochs: 10
device: cpu
data:
  dataset: FashionMNIST
  root: data
  mean: 0.286
  std: 0.353
  train_size: 55000
  val_size: 5000
  batch_size: 128
  num_workers: 0
model:
  name: cnn

scheduler:
  name: cosine
  step_size: 4
  gamma: 0.1
  plateau_factor: 0.5
  plateau_patience: 1
grad_accum_steps: 1
checkpoint:
  dir: lab06/checkpoints
  resume_from: null
  stop_after_epoch: null
mlflow:
  tracking_dir: lab06/mlflow_runs
  experiment: lab06-schedules
